apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iot-vnf-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mld-rafiee/iot-vnf-platform
    targetRevision: develop
    path: k8s
    directory:
      recurse: true              # scan all subdirectories
      exclude: "argocd/**"      # don't try to deploy ArgoCD's own config
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true

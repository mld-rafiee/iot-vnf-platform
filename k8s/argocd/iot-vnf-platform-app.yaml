apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iot-vnf-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mld-rafiee/iot-vnf-platform
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

# AES-256-GCM encryption key for the Encryption VNF
# 64 hex characters = 32 bytes = 256 bits
#
# Generate a real key:
#   python3 -c "import secrets; print(secrets.token_hex(32))"
#
# Then apply:
#   kubectl create secret generic enc-key -n vnf \
#     --from-literal=AES_KEY_HEX=<your-64-char-hex-key>
#
# The value below is a placeholder — replace before deploying to production.
# For the testbed/research environment this placeholder is acceptable.
apiVersion: v1
kind: Secret
metadata:
  name: enc-key
  namespace: vnf
  labels:
    app.kubernetes.io/part-of: iot-vnf-platform
type: Opaque
stringData:
  AES_KEY_HEX: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"
